<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12091f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Ultimate Surprise for Ms Baby 🔥🔥</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0b0711;
      --panel:#171020;
      --panel2:#21152e;
      --text:#fff8ff;
      --muted:#cdbfd5;
      --accent:#ef76c5;
      --accent2:#9f73ff;
      --good:#75e0a7;
      --warn:#ffd27a;
      --bad:#ff8a9b;
      --border:rgba(255,255,255,.12);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{
      background:
        radial-gradient(circle at 20% 0%,rgba(159,115,255,.18),transparent 38rem),
        radial-gradient(circle at 85% 20%,rgba(239,118,197,.15),transparent 34rem),
        var(--bg);
    }
    main{width:min(760px,100%);margin:0 auto;padding:20px 16px 48px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .brand{font-weight:800;letter-spacing:.02em}
    .status{font-size:.8rem;padding:6px 10px;border:1px solid var(--border);border-radius:999px;color:var(--muted)}
    .status.good{color:var(--good);border-color:rgba(117,224,167,.4)}
    .card{
      background:linear-gradient(180deg,rgba(33,21,46,.96),rgba(23,16,32,.96));
      border:1px solid var(--border);
      border-radius:24px;
      padding:24px;
      box-shadow:0 18px 70px rgba(0,0,0,.28);
    }
    .center{text-align:center}
    h1{font-size:clamp(2rem,8vw,4rem);line-height:1.02;margin:8px 0 16px}
    h2{font-size:clamp(1.5rem,5vw,2.2rem);margin:6px 0 12px}
    p{line-height:1.55}
    .subtitle{color:var(--muted);font-size:1.05rem}
    .small{font-size:.88rem;color:var(--muted)}
    .task{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:.8rem;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:var(--accent);
      margin-bottom:8px;
    }
    .btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
    button{
      appearance:none;
      border:0;
      border-radius:16px;
      padding:15px 18px;
      font:inherit;
      font-weight:800;
      cursor:pointer;
      min-height:52px;
    }
    button:disabled{opacity:.55;cursor:not-allowed}
    .primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;flex:1}
    .secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border)}
    .danger{background:rgba(255,138,155,.12);color:var(--bad);border:1px solid rgba(255,138,155,.3)}
    .progress{height:12px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;margin:20px 0 10px}
    .progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .35s ease}
    .metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
    .metric{padding:18px;border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.04)}
    .metric span{display:block;color:var(--muted);font-size:.82rem;margin-bottom:6px}
    .metric b{font-size:clamp(1.35rem,7vw,2.2rem)}
    .goodtext{color:var(--good)}
    .warntext{color:var(--warn)}
    .badtext{color:var(--bad)}
    .year{font-size:clamp(3rem,18vw,7rem);font-weight:900;letter-spacing:-.06em}
    .fade{animation:fade .7s ease}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .emoji{font-size:clamp(3rem,16vw,7rem);line-height:1.1}
    .surprise{font-size:1.12rem;line-height:1.75}
    details{margin-top:18px;border-top:1px solid var(--border);padding-top:12px}
    summary{cursor:pointer;color:var(--muted);font-size:.9rem}
    pre{white-space:pre-wrap;word-break:break-word;font-size:.76rem;color:#c9bdd2;max-height:220px;overflow:auto}
    .sensorline{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
    .chip{border:1px solid var(--border);border-radius:999px;padding:7px 10px;font-size:.8rem;color:var(--muted)}
    .chip.ok{color:var(--good);border-color:rgba(117,224,167,.35)}
    .chip.err{color:var(--bad);border-color:rgba(255,138,155,.35)}
    @media(max-width:520px){
      main{padding:14px 12px 36px}
      .card{padding:20px 16px;border-radius:20px}
      .metrics{grid-template-columns:1fr}
      .btnrow{flex-direction:column}
      .btnrow button{width:100%}
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <div class="brand">Ms Baby Surprise</div>
      <div id="bleStatus" class="status">Not connected</div>
    </div>
    <section id="screen" class="card center"></section>
    <details>
      <summary>Bluetooth debug</summary>
      <pre id="debug"></pre>
    </details>
  </main>

<script>
(() => {
  "use strict";

  const BUILD = "FRESH-START-1.6";

  const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
  const TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

  const screen = document.getElementById("screen");
  const bleStatus = document.getElementById("bleStatus");
  const debugEl = document.getElementById("debug");

  let device = null;
  let server = null;
  let rxChar = null;
  let txChar = null;
  let connected = false;
  let rxTextBuffer = "";

  let currentScanKind = null;
  let phoneScanStartedAt = 0;
  let pendingScanStart = null;
  let scanStartTimer = null;
  let scanStartAttempts = 0;

  let pendingIntensity = null;
  let mountainRetries = 0;

  let sensorStatus = { max: null, mcp: null, mpu: null };
  let lastTelemetryAt = 0;
  let telemetryWatchdog = null;

  function log(text) {
    const stamp = new Date().toLocaleTimeString();
    debugEl.textContent += `[${stamp}] ${text}\n`;
    debugEl.scrollTop = debugEl.scrollHeight;
  }

  function setBLEStatus(text, good = false) {
    bleStatus.textContent = text;
    bleStatus.className = good ? "status good" : "status";
  }

  function render(html, center = false) {
    screen.className = center ? "card center fade" : "card fade";
    screen.innerHTML = html;
  }

  function button(id, label, cls = "primary") {
    return `<button id="${id}" class="${cls}">${label}</button>`;
  }

  function sensorChips() {
    const chip = (label, value) => {
      if (value === true) return `<span class="chip ok">${label} ✓</span>`;
      if (value === false) return `<span class="chip err">${label} ✕</span>`;
      return `<span class="chip">${label} …</span>`;
    };

    return `
      <div class="sensorline">
        ${chip("Heart rate", sensorStatus.max)}
        ${chip("Temperature", sensorStatus.mcp)}
        ${chip("Motion", sensorStatus.mpu)}
      </div>
    `;
  }

  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  async function playIntro() {
    clearPendingScanStart();
    pendingIntensity = null;
    mountainRetries = 0;

    const frames = [
      ["2023...", 25, 900],
      ["2024...", 50, 900],
      ["2025...", 75, 900],
      ["2026 ✓", 100, 1100],
      ["2027...???", 100, 1500]
    ];

    for (const [year, pct, wait] of frames) {
      render(`
        <div class="year">${year}</div>
        <div class="progress"><div style="width:${pct}%"></div></div>
        <p class="small">${pct}%</p>
      `, true);
      await sleep(wait);
    }

    showHome();
  }

  function showHome() {
    render(`
      <div class="small">Game build ${BUILD}</div>
      <h1>Ultimate Surprise for Ms Baby 🔥🔥</h1>
      <p class="subtitle">A few challenges. One final surprise.</p>
      <div class="btnrow">
        ${button("playBtn", connected ? "Click to Play" : "Click to Play & Connect")}
      </div>
      <p class="small">Phone display only. Keep the Feather powered by USB.</p>
    `, true);

    document.getElementById("playBtn").addEventListener("click", async () => {
      if (!connected) {
        const ok = await connectBluetooth();
        if (!ok) return;
      }

      showTask1();
    });
  }

  async function connectBluetooth() {
    try {
      if (!window.isSecureContext) {
        throw new Error("This page must be opened from HTTPS.");
      }

      if (!navigator.bluetooth) {
        throw new Error(
          "Web Bluetooth is unavailable in this browser. On iPhone open this exact GitHub Pages URL inside Bluefy. On Android use Chrome."
        );
      }

      setBLEStatus("Choose device…");
      log("Opening Bluetooth chooser");

      device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

      if (!device) throw new Error("No Bluetooth device selected.");

      log(`Selected: ${device.name || "unnamed BLE device"}`);

      device.addEventListener("gattserverdisconnected", onDisconnected);

      server = await device.gatt.connect();
      log("GATT connected");

      const service = await server.getPrimaryService(SERVICE_UUID);
      rxChar = await service.getCharacteristic(RX_UUID);
      txChar = await service.getCharacteristic(TX_UUID);

      await txChar.startNotifications();
      txChar.addEventListener("characteristicvaluechanged", onNotification);

      connected = true;
      setBLEStatus(device.name || "Connected", true);

      await sleep(150);
      await sendCommand("PING");
      await sleep(100);
      await sendCommand("STATUS");

      if (telemetryWatchdog) clearInterval(telemetryWatchdog);
      telemetryWatchdog = setInterval(() => {
        if (!connected) return;

        // Only flag stale telemetry while a scan/preparation screen should
        // be receiving continuous data.
        const now = Date.now();
        if (
          currentScanKind &&
          lastTelemetryAt > 0 &&
          now - lastTelemetryAt > 4000
        ) {
          log("WARNING: live BLE telemetry has been silent for >4 seconds");
        }
      }, 1000);

      return true;
    } catch (error) {
      connected = false;
      setBLEStatus("Not connected");
      log(`CONNECT ERROR: ${error.message || error}`);

      render(`
        <div class="task">Bluetooth setup</div>
        <h2>Could not connect</h2>
        <p class="badtext">${escapeHtml(error.message || String(error))}</p>
        <p class="subtitle">
          Pick <b>ULTIMATE-SURPRISE</b> in the Bluetooth chooser.
          Do not pair it from the normal phone Bluetooth Settings screen.
        </p>
        <div class="btnrow">
          ${button("retryConnect", "Try Bluetooth Again")}
          ${button("backHome", "Back", "secondary")}
        </div>
      `);

      document.getElementById("retryConnect").addEventListener("click", async () => {
        if (await connectBluetooth()) showTask1();
      });
      document.getElementById("backHome").addEventListener("click", showHome);

      return false;
    }
  }

  function onDisconnected() {
    connected = false;
    rxChar = null;
    txChar = null;
    server = null;
    clearPendingScanStart();
    if (telemetryWatchdog) {
      clearInterval(telemetryWatchdog);
      telemetryWatchdog = null;
    }

    setBLEStatus("Disconnected");
    log("BLE disconnected");

    render(`
      <div class="task">Connection lost</div>
      <h2>The handheld disconnected</h2>
      <p class="subtitle">Keep the Feather powered, then reconnect.</p>
      <div class="btnrow">
        ${button("reconnectBtn", "Reconnect")}
      </div>
    `);

    document.getElementById("reconnectBtn").addEventListener("click", async () => {
      if (await connectBluetooth()) showTask1();
    });
  }

  async function sendCommand(command) {
    if (!connected || !rxChar) {
      throw new Error("Bluetooth is not connected.");
    }

    const bytes = new TextEncoder().encode(command + "\n");

    if (typeof rxChar.writeValueWithResponse === "function") {
      try {
        await rxChar.writeValueWithResponse(bytes);
        log(`> ${command}`);
        return;
      } catch (error) {
        log(`writeValueWithResponse fallback: ${error.message || error}`);
      }
    }

    if (typeof rxChar.writeValueWithoutResponse === "function") {
      await rxChar.writeValueWithoutResponse(bytes);
      log(`> ${command}`);
      return;
    }

    if (typeof rxChar.writeValue === "function") {
      await rxChar.writeValue(bytes);
      log(`> ${command}`);
      return;
    }

    throw new Error("This browser cannot write to the BLE UART characteristic.");
  }

  function onNotification(event) {
    const value = event.target.value;
    const chunk = new TextDecoder().decode(value);

    rxTextBuffer += chunk;

    let newline;
    while ((newline = rxTextBuffer.indexOf("\n")) !== -1) {
      const line = rxTextBuffer.slice(0, newline).replace(/\r/g, "").trim();
      rxTextBuffer = rxTextBuffer.slice(newline + 1);

      if (line) {
        log(`< ${line}`);
        handleDeviceLine(line);
      }
    }
  }

  function handleDeviceLine(line) {
    const p = line.split(",");
    const type = p[0];

    if (type === "PONG") {
      return;
    }

    if (type === "COMMAND_ACK") {
      return;
    }

    if (type === "STATUS") {
      sensorStatus = {
        max: p[1] === "1",
        mcp: p[2] === "1",
        mpu: p[3] === "1"
      };

      if (!sensorStatus.max || !sensorStatus.mcp || !sensorStatus.mpu) {
        showHardwareError();
      }
      return;
    }

    // Compact preparation telemetry from firmware 1.5:
    // R,bpm,tempC,finger,heartReady,tempReady,secondsWaiting,tempDeltaC,warmEnough
    if (type === "R") {
      lastTelemetryAt = Date.now();

      const tempC = finiteNumber(p[2], 0);
      const deltaC = finiteNumber(p[7], 999);

      showSensorPreparation(
        currentScanKind || "BASELINE",
        finiteNumber(p[1], 0),
        tempC,
        p[3] === "1",
        p[4] === "1",
        p[5] === "1",
        finiteNumber(p[6], 0),
        0,
        deltaC,
        p[8] === "1"
      );
      return;
    }

    // Compact official-scan telemetry from firmware 1.5:
    // P,percent,bpm,tempC,finger,secondsRemaining
    if (type === "P") {
      lastTelemetryAt = Date.now();

      showLiveScan(
        currentScanKind || "BASELINE",
        finiteNumber(p[1], 0),
        finiteNumber(p[2], 0),
        finiteNumber(p[3], 0),
        p[4] === "1",
        finiteNumber(p[5], 30),
        0
      );
      return;
    }

    if (type === "SENSOR_PREP_STARTED") {
      clearPendingScanStart();
      currentScanKind = p[1] || "BASELINE";
      showSensorPreparation(currentScanKind, 0, 0, false, false, false, 0, 0, 999, false);
      return;
    }

    if (type === "SENSOR_PREP") {
      lastTelemetryAt = Date.now();
      currentScanKind = p[1] || currentScanKind || "BASELINE";
      showSensorPreparation(
        currentScanKind,
        finiteNumber(p[2], 0),
        finiteNumber(p[3], 0),
        p[4] === "1",
        p[5] === "1",
        p[6] === "1",
        finiteNumber(p[7], 0),
        finiteNumber(p[8], 0),
        finiteNumber(p[9], 999),
        p[10] === "1"
      );
      return;
    }

    if (type === "SENSORS_READY") {
      return;
    }

    if (type === "SENSOR_PREP_TIMEOUT") {
      clearPendingScanStart();
      const kind = p[1] || currentScanKind || "BASELINE";
      showSensorPrepTimeout(kind, p[2] === "1", p[3] === "1");
      return;
    }

    if (type === "SCAN_STARTED") {
      clearPendingScanStart();
      currentScanKind = p[1] || "BASELINE";
      phoneScanStartedAt = Date.now();
      showLiveScan(currentScanKind, 0, 0, 0, false, 30, 0);
      return;
    }

    if (type === "SCAN_PROGRESS") {
      lastTelemetryAt = Date.now();
      currentScanKind = p[1] || currentScanKind || "BASELINE";

      const pct = finiteNumber(p[2], 0);
      const bpm = finiteNumber(p[3], 0);
      const temp = finiteNumber(p[4], 0);
      const finger = p[5] === "1";

      let seconds = finiteNumber(p[6], NaN);
      if (!Number.isFinite(seconds)) {
        if (phoneScanStartedAt > 0) {
          seconds = Math.max(
            0,
            Math.ceil(30 - (Date.now() - phoneScanStartedAt) / 1000)
          );
        } else {
          seconds = Math.max(0, Math.ceil((100 - pct) * 0.30));
        }
      }

      const ir = finiteNumber(p[7], 0);

      showLiveScan(
        currentScanKind,
        pct,
        bpm,
        temp,
        finger,
        seconds,
        ir
      );
      return;
    }

    if (type === "SCAN_RETRY") {
      clearPendingScanStart();
      phoneScanStartedAt = 0;
      showScanRetry(p[1], p[2] || "SIGNAL");
      return;
    }

    if (type === "SCAN_DONE") {
      clearPendingScanStart();
      phoneScanStartedAt = 0;

      const result = {
        kind: p[1],
        bpm: Number(p[2]),
        temp: Number(p[3])
      };

      showScanComplete(result);
      return;
    }

    if (type === "INTENSITY") {
      pendingIntensity = {
        pass: p[1] === "PASS",
        hrPct: Number(p[2]),
        tempPct: Number(p[3]),
        hrPass: p[4] === "1",
        tempPass: p[5] === "1"
      };
      return;
    }

    if (type === "LUNGE_STARTED") {
      showLungeProgress(0, 0, 0, false);
      return;
    }

    if (type === "OUTBOUND_COMPLETE") {
      showLungeTurn();
      return;
    }

    if (type === "TURN_DETECTED") {
      return;
    }

    if (type === "LUNGE_PROGRESS") {
      showLungeProgress(
        Number(p[1]),
        Number(p[2]),
        Number(p[3]),
        p[4] === "1"
      );
      return;
    }

    if (type === "LUNGE_DONE") {
      showLungeComplete();
      return;
    }

    if (type === "LUNGE_TIMEOUT") {
      showLungeTimeout();
      return;
    }

    if (type === "ERROR") {
      clearPendingScanStart();
      handleDeviceError(p[1] || "UNKNOWN");
      return;
    }
  }

  function showHardwareError() {
    render(`
      <div class="task">Hardware check</div>
      <h2>One or more sensors are not ready</h2>
      ${sensorChips()}
      <p class="subtitle">
        Reset the Feather and check the shared 3V, GND, SDA, and SCL wiring.
        The game will not start biometric tasks until the sensors are detected.
      </p>
      <div class="btnrow">
        ${button("statusAgain", "Check Sensors Again")}
        ${button("homeAgain", "Back", "secondary")}
      </div>
    `);

    document.getElementById("statusAgain").addEventListener("click", async () => {
      try {
        await sendCommand("STATUS");
      } catch (error) {
        onDisconnected();
      }
    });
    document.getElementById("homeAgain").addEventListener("click", showHome);
  }

  function showTask1() {
    render(`
      <div class="task">Task 1 · Baseline</div>
      <h2>30-second biometric baseline</h2>
      <p class="subtitle">
        Hold the handheld with one thumb resting steadily on the
        <b>MAX30102 heart-rate sensor</b> and the other thumb resting on the
        <b>MCP9808 temperature sensor</b>.
      </p>
      ${sensorChips()}
      <p>Keep both thumbs steady for the entire 30 seconds.</p>
      <div class="btnrow">
        ${button("baselineStart", "Begin 30-Second Scan")}
      </div>
      <p class="small">
        Heart rate and temperature will update live on this screen.
      </p>
    `);

    document.getElementById("baselineStart").addEventListener("click", () => {
      beginScanReliably("BASELINE", "START_BASELINE");
    });
  }

  function scanTitle(kind) {
    if (kind === "BASELINE") return "Baseline Scan";
    if (kind === "PUSHUPS") return "Post-Pushup Scan";
    if (kind === "MOUNTAIN") return "Post-Mountain-Climber Scan";
    return "Biometric Scan";
  }

  function showSensorPreparation(
    kind,
    bpm,
    temp,
    finger,
    heartReady,
    tempReady,
    secondsWaiting,
    ir = 0,
    tempWindowDelta = 999,
    tempWarmEnough = false
  ) {
    bpm = finiteNumber(bpm, 0);
    temp = finiteNumber(temp, 0);
    secondsWaiting = finiteNumber(secondsWaiting, 0);
    ir = finiteNumber(ir, 0);
    tempWindowDelta = finiteNumber(tempWindowDelta, 999);

    const tempF = cToF(temp);
    const tempDeltaF =
      tempWindowDelta < 999
        ? tempWindowDelta * 9 / 5
        : 999;

    const tempStatus = tempReady
      ? "Stable ✓"
      : !tempWarmEnough
        ? `Warming up… ${Math.max(0, 20 - Math.round(secondsWaiting))} s minimum`
        : tempDeltaF < 999
          ? `Settling… Δ ${tempDeltaF.toFixed(2)} °F / 5 s`
          : "Measuring stability…";

    render(`
      <div class="task">${scanTitle(kind)} · Sensor Lock</div>
      <h2>Getting your readings ready…</h2>

      <p class="subtitle">
        The 30-second timer has <b>not started yet</b>.
        Keep both thumbs completely still while the sensors lock onto you.
      </p>

      <div class="metrics">
        <div class="metric">
          <span>Heart Rate Lock</span>
          <b>${bpm > 0 ? `${Math.round(bpm)} BPM` : "Acquiring…"}</b>
          <div class="${heartReady ? "goodtext" : "warntext"}">
            ${heartReady ? "Ready ✓" : finger ? "Finding stable beats…" : "Place thumb on MAX30102"}
          </div>
        </div>

        <div class="metric">
          <span>Temperature Lock</span>
          <b>${temp !== 0 && Number.isFinite(tempF) ? `${tempF.toFixed(1)} °F` : "Acquiring…"}</b>
          <div class="${tempReady ? "goodtext" : "warntext"}">
            ${tempStatus}
          </div>
        </div>
      </div>

      <p class="${finger ? "goodtext" : "warntext"}">
        ${finger ? "Heart sensor contact detected ✓" : "Keep your heart-rate thumb on the MAX30102."}
      </p>

      <p class="small">
        Waiting ${Math.round(secondsWaiting)} s · IR signal ${Math.round(ir)}
      </p>

      <div class="progress">
        <div style="width:${heartReady && tempReady ? 100 : heartReady || tempReady ? 55 : 20}%"></div>
      </div>

      <p class="small">
        The official 30-second scan starts only after heart rate is locked and
        temperature has warmed for at least 20 seconds and stopped changing rapidly.
      </p>
    `);
  }

  function showSensorPrepTimeout(kind, heartReady, tempReady) {
    const command =
      kind === "BASELINE"
        ? "START_BASELINE"
        : kind === "PUSHUPS"
          ? "START_POST_PUSHUPS"
          : "START_POST_MOUNTAIN";

    render(`
      <div class="task">${scanTitle(kind)} · Sensor Lock</div>
      <h2>Couldn't get both readings ready</h2>

      <div class="sensorline">
        <span class="chip ${heartReady ? "ok" : "err"}">
          Heart rate ${heartReady ? "✓" : "not locked"}
        </span>
        <span class="chip ${tempReady ? "ok" : "err"}">
          Temperature ${tempReady ? "✓" : "not locked"}
        </span>
      </div>

      <p class="subtitle">
        Reposition your thumbs and try again. The game will not waste any of
        the official 30 seconds on zero or missing readings.
      </p>

      <div class="btnrow">
        ${button("prepRetry", "Retry Sensor Lock")}
      </div>
    `);

    document.getElementById("prepRetry").addEventListener("click", () => {
      beginScanReliably(kind, command);
    });
  }

  function showLiveScan(kind, pct, bpm, temp, finger, seconds, ir = 0) {
    pct = finiteNumber(pct, 0);
    bpm = finiteNumber(bpm, 0);
    temp = finiteNumber(temp, 0);
    seconds = finiteNumber(seconds, 30);
    ir = finiteNumber(ir, 0);

    const hrText =
      finger && bpm > 0
        ? `${Math.round(bpm)} BPM`
        : "Reading…";

    const tempF = cToF(temp);

    const tempText =
      temp !== 0 && Number.isFinite(tempF)
        ? `${tempF.toFixed(1)} °F`
        : "Reading…";

    render(`
      <div class="task">${scanTitle(kind)}</div>
      <h2>Hold both thumbs steady</h2>

      <div class="progress"><div style="width:${clamp(pct,0,100)}%"></div></div>
      <p class="subtitle">
        <b>${clamp(Math.round(pct),0,100)}%</b> complete ·
        <b>${Math.max(0, Math.round(seconds))} seconds</b> remaining
      </p>

      <div class="metrics">
        <div class="metric">
          <span>Live Heart Rate</span>
          <b>${hrText}</b>
        </div>
        <div class="metric">
          <span>Live Temperature</span>
          <b>${tempText}</b>
        </div>
      </div>

      <p class="${finger ? "goodtext" : "warntext"}">
        ${finger
          ? "Heart sensor contact detected ✓"
          : "Keep your heart-rate thumb still on the MAX30102."}
      </p>

      <p class="small">
        Final values are the full 30-second averages.
        <span class="goodtext">Live data link active ✓</span>
      </p>
    `);
  }

  function showStartingScan(kind, attempt) {
    render(`
      <div class="task">${scanTitle(kind)}</div>
      <h2>Preparing the sensors…</h2>
      <div class="progress"><div style="width:3%"></div></div>
      <p class="subtitle">Confirming the handheld · attempt ${attempt} of 3</p>
      <p>Place both thumbs on the sensors now. The 30-second timer begins only after both readings are valid.</p>
    `);
  }

  async function beginScanReliably(kind, command) {
    clearPendingScanStart();

    pendingScanStart = { kind, command };
    scanStartAttempts = 0;

    await sendScanStartAttempt();
  }

  async function sendScanStartAttempt() {
    if (!pendingScanStart) return;

    scanStartAttempts += 1;
    showStartingScan(pendingScanStart.kind, scanStartAttempts);

    try {
      await sendCommand(pendingScanStart.command);
    } catch (error) {
      clearPendingScanStart();
      showCommandFailure(error.message || String(error));
      return;
    }

    scanStartTimer = setTimeout(async () => {
      if (!pendingScanStart) return;

      if (scanStartAttempts < 3) {
        await sendScanStartAttempt();
      } else {
        clearPendingScanStart();
        showCommandFailure(
          "The Feather did not confirm the scan after three attempts."
        );
      }
    }, 1800);
  }

  function clearPendingScanStart() {
    if (scanStartTimer) {
      clearTimeout(scanStartTimer);
      scanStartTimer = null;
    }

    pendingScanStart = null;
    scanStartAttempts = 0;
  }

  function showCommandFailure(message) {
    render(`
      <div class="task">Bluetooth command check</div>
      <h2>The scan did not start</h2>
      <p class="badtext">${escapeHtml(message)}</p>
      <p class="subtitle">
        Check the Bluetooth debug section. A healthy connection should show
        COMMAND_ACK followed by SCAN_STARTED.
      </p>
      <div class="btnrow">
        ${button("backTask1", "Return to Task 1")}
        ${button("reconnectFromFailure", "Reconnect Bluetooth", "secondary")}
      </div>
    `);

    document.getElementById("backTask1").addEventListener("click", showTask1);
    document.getElementById("reconnectFromFailure").addEventListener("click", async () => {
      if (await connectBluetooth()) showTask1();
    });
  }

  function showScanRetry(kind, reason) {
    const friendly =
      reason.includes("HEART") && reason.includes("TEMP")
        ? "The scan did not collect enough valid heart-rate and temperature data."
        : reason.includes("HEART")
          ? "The heart-rate signal was not steady enough."
          : "The temperature reading was interrupted. Reposition your thumb and try once more.";

    const command =
      kind === "BASELINE"
        ? "START_BASELINE"
        : kind === "PUSHUPS"
          ? "START_POST_PUSHUPS"
          : "START_POST_MOUNTAIN";

    render(`
      <div class="task">${scanTitle(kind)}</div>
      <h2>Let's redo that reading</h2>
      <p class="subtitle">${friendly}</p>
      <p>
        Keep steady pressure on the MAX30102 and keep your other thumb
        touching the MCP9808 for the full scan.
      </p>
      <div class="btnrow">
        ${button("retryScanBtn", "Retry 30-Second Scan")}
      </div>
    `);

    document.getElementById("retryScanBtn").addEventListener("click", () => {
      beginScanReliably(kind, command);
    });
  }

  function showScanComplete(result) {
    let nextLabel = "Next";
    let nextAction = () => {};

    if (result.kind === "BASELINE") {
      nextLabel = "Next — 10 Pushups";
      nextAction = showPushupChallenge;
    } else if (result.kind === "PUSHUPS") {
      nextLabel = "Next — 50 Mountain Climbers";
      nextAction = showMountainChallenge;
    } else if (result.kind === "MOUNTAIN") {
      nextLabel = "Next — Check Results";
      nextAction = showIntensityWhenReady;
    }

    render(`
      <div class="task">30-Second Scan Complete</div>
      <h2>${scanTitle(result.kind)} captured ✓</h2>
      <div class="progress"><div style="width:100%"></div></div>
      <p class="goodtext">100% complete ✓</p>

      <div class="metrics">
        <div class="metric">
          <span>30-Second Average BPM</span>
          <b>${result.bpm.toFixed(1)} BPM</b>
        </div>
        <div class="metric">
          <span>30-Second Average Temperature</span>
          <b>${cToF(result.temp).toFixed(1)} °F</b>
        </div>
      </div>

      <div class="btnrow">
        ${button("scanNext", nextLabel)}
      </div>
    `);

    document.getElementById("scanNext").addEventListener("click", nextAction);
  }

  function showPushupChallenge() {
    render(`
      <div class="task">Task 2 · Pushups</div>
      <h2>10 pushups</h2>
      <p class="subtitle">
        Complete 10 pushups at a comfortable pace.
      </p>
      <p class="small">
        Stop if you feel pain, dizziness, or unusual shortness of breath.
      </p>
      <div class="btnrow">
        ${button("pushupsDone", "I Finished 10 Pushups")}
      </div>
    `);

    document.getElementById("pushupsDone").addEventListener("click", () => {
      showPostExerciseReady(
        "Post-Pushup Reading",
        "START_POST_PUSHUPS",
        "PUSHUPS"
      );
    });
  }

  function showMountainChallenge() {
    render(`
      <div class="task">Task 3 · Mountain Climbers</div>
      <h2>50 mountain climbers</h2>
      <p class="subtitle">
        Complete 50 mountain climbers, then take another 30-second reading.
      </p>
      <p>
        Game targets after this round:
        <b>heart rate +10%</b> and <b>temperature +5%</b>
        compared with the original baseline.
      </p>
      <p class="small">
        Stop if you feel pain, dizziness, or unusual shortness of breath.
      </p>
      <div class="btnrow">
        ${button("mountainDone", "I Finished 50 Mountain Climbers")}
      </div>
    `);

    document.getElementById("mountainDone").addEventListener("click", () => {
      showPostExerciseReady(
        "Post-Mountain-Climber Reading",
        "START_POST_MOUNTAIN",
        "MOUNTAIN"
      );
    });
  }

  function showPostExerciseReady(title, command, kind) {
    render(`
      <div class="task">${title}</div>
      <h2>Get both sensors ready</h2>
      <p class="subtitle">
        Put one thumb on the MAX30102 and the other on the MCP9808.
        Start as soon as you're holding both steadily.
      </p>
      <div class="btnrow">
        ${button("postExerciseScan", "Begin 30-Second Scan")}
      </div>
    `);

    document.getElementById("postExerciseScan").addEventListener("click", () => {
      beginScanReliably(kind, command);
    });
  }

  async function showIntensityWhenReady() {
    if (!pendingIntensity) {
      render(`
        <div class="task">Calculating response</div>
        <h2>Checking the challenge targets…</h2>
        <p class="subtitle">Waiting for the Feather's comparison result.</p>
      `);

      for (let i = 0; i < 20 && !pendingIntensity; i++) {
        await sleep(100);
      }
    }

    if (!pendingIntensity) {
      showCommandFailure("The comparison result did not arrive.");
      return;
    }

    const result = pendingIntensity;
    pendingIntensity = null;

    if (result.pass) {
      render(`
        <div class="task">Task 3 Complete</div>
        <h2>Targets reached ✓</h2>
        <div class="metrics">
          <div class="metric">
            <span>Heart-rate change</span>
            <b>${formatSigned(result.hrPct)}%</b>
            <div class="${result.hrPass ? "goodtext" : "badtext"}">
              Target: +10%
            </div>
          </div>
          <div class="metric">
            <span>Sensor-temperature change</span>
            <b>${formatSigned(result.tempPct)}%</b>
            <div class="${result.tempPass ? "goodtext" : "badtext"}">
              Target: +5%
            </div>
          </div>
        </div>
        <div class="btnrow">
          ${button("toLunges", "Next — Final Challenge")}
        </div>
      `);

      document.getElementById("toLunges").addEventListener("click", showLungeInstructions);
      return;
    }

    if (mountainRetries < 1) {
      mountainRetries += 1;

      render(`
        <div class="task">Challenge Retry</div>
        <h2>One more round</h2>
        <div class="metrics">
          <div class="metric">
            <span>Heart-rate change</span>
            <b>${formatSigned(result.hrPct)}%</b>
            <div class="${result.hrPass ? "goodtext" : "warntext"}">
              Target: +10%
            </div>
          </div>
          <div class="metric">
            <span>Sensor-temperature change</span>
            <b>${formatSigned(result.tempPct)}%</b>
            <div class="${result.tempPass ? "goodtext" : "warntext"}">
              Target: +5%
            </div>
          </div>
        </div>
        <p class="subtitle">
          The game allows one mountain-climber retry.
        </p>
        <div class="btnrow">
          ${button("retryMountain", "Retry 50 Mountain Climbers")}
        </div>
      `);

      document.getElementById("retryMountain").addEventListener("click", showMountainChallenge);
      return;
    }

    // Do not force repeated exercise because a contact sensor can vary.
    render(`
      <div class="task">Task 3 Recorded</div>
      <h2>Reading saved ✓</h2>
      <div class="metrics">
        <div class="metric">
          <span>Heart-rate change</span>
          <b>${formatSigned(result.hrPct)}%</b>
        </div>
        <div class="metric">
          <span>Sensor-temperature change</span>
          <b>${formatSigned(result.tempPct)}%</b>
        </div>
      </div>
      <p class="subtitle">
        You've completed the allowed retry. Continue to the final challenge.
      </p>
      <div class="btnrow">
        ${button("continueAfterRetry", "Next — Final Challenge")}
      </div>
    `);

    document.getElementById("continueAfterRetry").addEventListener("click", showLungeInstructions);
  }

  function showLungeInstructions() {
    render(`
      <div class="task">Task 4 · Final Challenge</div>
      <h2>Walking lunges: 5 m out + 5 m back</h2>
      <p class="subtitle">
        Mark a real <b>5-meter</b> distance on the floor.
        Hold the handheld while doing walking lunges to the marker,
        turn around, then lunge back to the start.
      </p>
      <p>
        The MPU6050 verifies lunge-like movement and the turnaround.
        It cannot accurately measure an exact 5-meter distance by itself,
        so the physical floor marker provides the distance.
      </p>
      <div class="btnrow">
        ${button("startLunges", "Start Walking Lunges")}
      </div>
    `);

    document.getElementById("startLunges").addEventListener("click", async () => {
      try {
        await sendCommand("START_LUNGES");
      } catch (error) {
        showCommandFailure(error.message || String(error));
      }
    });
  }

  function showLungeProgress(percent, outCount, backCount, turned) {
    let instruction = "Lunge toward the 5-meter marker.";

    if (outCount >= 5 && !turned) {
      instruction = "Turn around at the 5-meter marker.";
    } else if (turned) {
      instruction = "Lunge back toward the starting point.";
    }

    render(`
      <div class="task">Final Challenge In Progress</div>
      <h2>${instruction}</h2>
      <div class="progress"><div style="width:${clamp(percent,0,100)}%"></div></div>
      <p class="subtitle">${clamp(Math.round(percent),0,100)}% verified</p>

      <div class="metrics">
        <div class="metric">
          <span>Outbound movement events</span>
          <b>${outCount}/5</b>
        </div>
        <div class="metric">
          <span>Return movement events</span>
          <b>${backCount}/5</b>
        </div>
      </div>
    `);
  }

  function showLungeTurn() {
    render(`
      <div class="task">Halfway Point</div>
      <h2>Turn around ↩</h2>
      <p class="subtitle">
        You've reached the outbound movement target.
        Turn around at the physical 5-meter marker, then continue back.
      </p>
      <div class="progress"><div style="width:50%"></div></div>
    `, true);
  }

  function showLungeComplete() {
    render(`
      <div class="task">All Challenges Complete</div>
      <div class="emoji">🏁✨</div>
      <h2>Would you like the surprise?</h2>
      <div class="btnrow">
        ${button("showSurprise", "Yes — Show Me the Surprise")}
      </div>
    `, true);

    document.getElementById("showSurprise").addEventListener("click", showSurprise);
  }

  function showLungeTimeout() {
    render(`
      <div class="task">Final Challenge</div>
      <h2>Motion verification timed out</h2>
      <p class="subtitle">
        Return to the starting position and try the 5 m out-and-back again.
      </p>
      <div class="btnrow">
        ${button("retryLunges", "Retry Walking Lunges")}
      </div>
    `);

    document.getElementById("retryLunges").addEventListener("click", showLungeInstructions);
  }

  function showSurprise() {
    render(`
      <div class="task">For Mi Reina ❤️</div>
      <h2>Surprise ✈️🌴</h2>
      <p class="surprise">
        Congratulations on completing the tasks! You never fail to inspire.
        Your impact is everything. From motivating me out of dark times and
        keeping me going in life, I truly believe you deserve this.
        You mean everything to me. You've been the best person in the world.
        Please allow me to take you on a vacation to Cancun, Mexico at
        The Reef Playcar from January 18 - January 23, 2027 Mi Reina ❤️.
      </p>

      <div class="btnrow">
        ${button("acceptBtn", "Accept ❤️")}
        ${button("declineBtn", "Decline", "danger")}
      </div>
    `);

    document.getElementById("acceptBtn").addEventListener("click", acceptSurprise);
    document.getElementById("declineBtn").addEventListener("click", declineSurprise);
  }

  async function acceptSurprise() {
    try { await sendCommand("ACCEPT"); } catch (_) {}

    render(`
      <div class="emoji">🥳🎉💖</div>
      <h1>CANCUN 2027!!!</h1>
      <p class="subtitle">January 18 – January 23, 2027 ❤️</p>
      <div id="restartArea"></div>
    `, true);

    await sleep(3000);
    document.getElementById("restartArea").innerHTML =
      `<div class="btnrow">${button("restartGame", "Restart Game", "secondary")}</div>`;

    document.getElementById("restartGame").addEventListener("click", restartGame);
  }

  async function declineSurprise() {
    try { await sendCommand("DECLINE"); } catch (_) {}

    render(`
      <div class="emoji">😢💩</div>
      <h2>Declined 😭</h2>
      <div id="restartArea"></div>
    `, true);

    await sleep(3000);
    document.getElementById("restartArea").innerHTML =
      `<div class="btnrow">${button("restartGame", "Restart Game", "secondary")}</div>`;

    document.getElementById("restartGame").addEventListener("click", restartGame);
  }

  async function restartGame() {
    mountainRetries = 0;
    pendingIntensity = null;
    clearPendingScanStart();

    if (connected) {
      try { await sendCommand("RESTART"); } catch (_) {}
    }

    await playIntro();
  }

  function handleDeviceError(code) {
    if (code === "BIOMETRIC_SENSOR") {
      render(`
        <div class="task">Sensor Error</div>
        <h2>The heart-rate or temperature sensor is not ready</h2>
        ${sensorChips()}
        <p class="subtitle">
          Reset the Feather, verify the sensor wiring, reconnect Bluetooth,
          and check STATUS again.
        </p>
        <div class="btnrow">
          ${button("sensorHome", "Back to Start")}
        </div>
      `);
      document.getElementById("sensorHome").addEventListener("click", showHome);
      return;
    }

    if (code === "MPU6050") {
      render(`
        <div class="task">Motion Sensor Error</div>
        <h2>The MPU6050 is not ready</h2>
        <p class="subtitle">Reset the Feather and check SDA, SCL, 3V, and GND.</p>
        <div class="btnrow">
          ${button("motionBack", "Back")}
        </div>
      `);
      document.getElementById("motionBack").addEventListener("click", showLungeInstructions);
      return;
    }

    showCommandFailure(`Feather error: ${code}`);
  }

  function cToF(celsius) {
    const c = finiteNumber(celsius, NaN);
    return Number.isFinite(c) ? (c * 9 / 5) + 32 : NaN;
  }

  function finiteNumber(value, fallback = 0) {
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
  }

  function formatSigned(value) {
    if (!Number.isFinite(value)) return "0.0";
    return `${value >= 0 ? "+" : ""}${value.toFixed(1)}`;
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, Number(value) || 0));
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  playIntro();
})();
</script>
</body>
</html>
